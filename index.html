<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b12">
  <title>NORTH/TH — Tromsø Aurora 7D6N</title>
  <style>
    html,body{margin:0;background:#060b12;color:#eef7f3;font-family:system-ui,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    #boot span{opacity:.75}#boot b{display:block;color:#7df7b9;margin-bottom:10px;font-size:20px}
  </style>
</head>
<body>
  <div id="boot"><span><b>Loading Aurora…</b>กำลังโหลดหน้าเว็บโดยตรง</span></div>
  <script>
  (async () => {
    try {
      const urls = Array.from({length: 11}, (_, i) => `payload/part-${String(i).padStart(2,'0')}.txt?v=4`);
      const parts = await Promise.all(urls.map(async (url) => {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${url} returned ${response.status}`);
        return response.text();
      }));
      const html = parts.join('');
      if (!html.startsWith('<!doctype html>') || !html.includes('</html>')) throw new Error('HTML payload validation failed');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error('Aurora direct loader failed:', error);
      document.getElementById('boot').innerHTML = `<span><b>โหลดเว็บไม่สำเร็จ</b>${String(error.message || error)}</span>`;
    }
  })();
  </script>
</body>
</html>
