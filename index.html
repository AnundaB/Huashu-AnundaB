<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b12">
  <title>NORTH/TH — Tromsø Aurora 7D6N</title>
  <style>
    html,body{margin:0;background:#060b12;color:#eef7f3;font-family:system-ui,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    #boot span{opacity:.75}#boot b{display:block;color:#7df7b9;margin-bottom:10px;font-size:20px}
  </style>
</head>
<body>
  <div id="boot"><span><b>Loading Aurora…</b>กำลังโหลดหน้าเว็บโดยตรง</span></div>
  <script>
  (async () => {
    try {
      const urls = Array.from({length: 11}, (_, i) => `payload/part-${String(i).padStart(2,'0')}.txt?v=4`);
      const parts = await Promise.all(urls.map(async (url) => {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${url} returned ${response.status}`);
        return response.text();
      }));
      let html = parts.join('');
      if (!html.startsWith('<!doctype html>') || !html.includes('</html>')) throw new Error('HTML payload validation failed');

      const mobileCss = `<style id="mobile-nav-hotfix">
        .mobile-menu-toggle,.mobile-menu-panel{display:none}
        @media(max-width:900px){
          .nav-links{display:none!important}
          .mobile-menu-toggle{display:grid;width:44px;height:44px;padding:0;place-items:center;border:1px solid rgba(238,247,243,.25);border-radius:999px;background:rgba(5,10,16,.52);color:#eef7f3;cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
          .mobile-menu-icon{width:18px;height:14px;position:relative;display:block}
          .mobile-menu-icon:before,.mobile-menu-icon:after,.mobile-menu-icon span{content:"";position:absolute;left:0;width:18px;height:1.5px;background:currentColor;border-radius:99px;transition:.22s ease}
          .mobile-menu-icon:before{top:1px}.mobile-menu-icon span{top:6px}.mobile-menu-icon:after{top:11px}
          .mobile-menu-toggle[aria-expanded="true"] .mobile-menu-icon:before{top:6px;transform:rotate(45deg)}
          .mobile-menu-toggle[aria-expanded="true"] .mobile-menu-icon span{opacity:0}
          .mobile-menu-toggle[aria-expanded="true"] .mobile-menu-icon:after{top:6px;transform:rotate(-45deg)}
          .mobile-menu-panel{display:block;position:fixed;z-index:25;top:76px;left:18px;right:18px;padding:14px;border:1px solid rgba(238,247,243,.16);border-radius:22px;background:rgba(5,10,16,.94);box-shadow:0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;transform:translateY(-10px) scale(.985);pointer-events:none;transition:opacity .2s ease,transform .26s cubic-bezier(.22,1,.36,1)}
          .mobile-menu-panel[data-open="true"]{opacity:1;transform:none;pointer-events:auto}
          .mobile-menu-panel a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 10px;border-bottom:1px solid rgba(238,247,243,.1);color:#eef7f3;font-size:16px;text-decoration:none}
          .mobile-menu-panel a:after{content:"↗";color:#7df7b9;font-size:13px}
          .mobile-menu-panel a:last-child{border-bottom:0}
          .mobile-menu-panel .mobile-menu-cta{margin-top:10px;justify-content:center;border:1px solid #7df7b9;border-radius:999px;background:#7df7b9;color:#04100b;font-weight:760}
          .mobile-menu-panel .mobile-menu-cta:after{content:"→";color:#04100b;margin-left:8px}
          body.mobile-menu-open{overflow:hidden}
        }
      </style>`;

      const mobileMarkup = `<button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu-panel" aria-label="เปิดเมนู"><span class="mobile-menu-icon" aria-hidden="true"><span></span></span></button></header><nav class="mobile-menu-panel" id="mobile-menu-panel" data-open="false" aria-label="เมนูบนโทรศัพท์"><a href="#route">เส้นทาง</a><a href="#highlights">ไฮไลต์</a><a href="#itinerary">โปรแกรม</a><a href="#prepare">เตรียมตัว</a><a class="mobile-menu-cta" href="#booking">รับรายละเอียดทัวร์</a></nav>`;

      const mobileJs = `<script>(function(){var b=document.querySelector('.mobile-menu-toggle'),p=document.querySelector('#mobile-menu-panel');if(!b||!p)return;function setMenu(open){b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'ปิดเมนู':'เปิดเมนู');p.dataset.open=String(open);document.body.classList.toggle('mobile-menu-open',open)}b.addEventListener('click',function(){setMenu(b.getAttribute('aria-expanded')!=='true')});p.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setMenu(false)})});document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});window.addEventListener('resize',function(){if(innerWidth>900)setMenu(false)},{passive:true})})();<\/script>`;

      html = html.replace('</head>', mobileCss + '</head>');
      html = html.replace('</header>', mobileMarkup);
      html = html.replace('</body>', mobileJs + '</body>');

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error('Aurora direct loader failed:', error);
      document.getElementById('boot').innerHTML = `<span><b>โหลดเว็บไม่สำเร็จ</b>${String(error.message || error)}</span>`;
    }
  })();
  </script>
</body>
</html>
